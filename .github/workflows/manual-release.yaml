name: Manual Release to attach binaries

on:
  workflow_dispatch:
    inputs:
      git_tag:
        description: 'Existing Git tag to (re)publish assets for, e.g. v0.2.0'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.git_tag }}
  cancel-in-progress: false

jobs:
  go-releaser:
    name: Build and Attach Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.git_tag }}

      - name: Fetch all tags
        run: git fetch --force --tags

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: ~> v2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
