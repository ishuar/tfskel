version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # Start with all linters and selectively disable what doesn't fit
  default: all

  disable:
    # Not applicable for this project
    - arangolint      # ArangoDB specific
    - depguard        # No import restrictions needed initially
    - gosmopolitan    # Not internationalizing
    - iface           # Too opinionated for interfaces
    - ireturn         # Too restrictive for return types
    - nlreturn        # Blank line style too strict
    - nonamedreturns  # Named returns can be useful
    - paralleltest    # Not all tests need parallel
    - tagliatelle     # Struct tag style not needed
    - testpackage     # Allow same package tests
    - varnamelen      # Short names are fine in Go
    - wrapcheck       # Too strict for error wrapping
    - wsl             # Whitespace style too opinionated
    - exhaustruct     # Too strict for struct initialization
    - forbidigo       # Overridden below — narrow rule enabled via settings.forbidigo
    - gochecknoglobals # Overridden below — enabled, with internal/ exempted
    - noctx           # Not all HTTP requests need context
    - protogetter     # No protobuf in this project
    - goheader        # No custom header enforcement
    - interfacebloat  # Interface size is fine
    - lll             # Line length handled by formatter
    - wsl_v5          # Whitespace style handled by formatter
    - godot           # Sentence ending periods not enforced
    - testifylint     # Testify usage is acceptable
    - usetesting      # Not applicable to this codebase
    - noinlineerr     # Inline error handling is idiomatic Go
    - funcorder       # Enforces "exported methods before unexported" on each receiver.
                      # This project prefers locality (helpers placed next to the method
                      # that uses them) over positional uniformity, so the rule is off.
                      # The constructor-after-struct half of the rule is already followed
                      # by convention (NewXxxCmd lives directly below xxxOpts).
    - gocyclo         # Redundant with cyclop (both measure cyclomatic complexity per function);
                      # cyclop is the modern successor and also checks package-level complexity.

  settings:
    # Complexity — two complementary metrics:
    #   cyclop   → cyclomatic complexity (branch count). Classic control-flow metric.
    #   gocognit → cognitive complexity (nesting-weighted). Captures "how hard is
    #              this to read" in a way cyclomatic doesn't.
    # gocyclo is intentionally disabled above — it duplicates cyclop.
    cyclop:
      max-complexity: 15

    gocognit:
      min-complexity: 25

    # Function length — 80 lines / 40 statements. CONTRIBUTING.md targets 50
    # lines, but 80 is the enforced floor that catches genuine bloat without
    # churning on well-structured functions that happen to be slightly long.
    funlen:
      lines: 80
      statements: 40
      ignore-comments: true

    # Code duplication — flag copy-pasted blocks of >= 100 tokens.
    dupl:
      threshold: 100

    # Nesting depth — flag `if` chains nested 4 levels or deeper.
    nestif:
      min-complexity: 4

    # Constants — extract when a literal >= 3 chars appears >= 3 times.
    goconst:
      min-len: 3
      min-occurrences: 3

    # Magic numbers — explicitly allow 0/1/2 (loop/index idioms) and the
    # standard unix permission octals. Anything else should be a named const.
    mnd:
      ignored-numbers:
        - "0"
        - "1"
        - "2"
        - "0600"
        - "0644"
        - "0755"

    # Error checks
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close

    errorlint:
      errorf: true
      asserts: true
      comparison: true

    # Go vet
    govet:
      enable-all: true
      disable:
        - shadow
        - fieldalignment

    # Security
    gosec:
      excludes:
        - G104  # Audit errors (covered by errcheck)
        - G204  # Subprocess with variable (needed for CLI)
        - G301  # Directory permissions 0755 (standard)
        - G302  # File permissions check
        - G304  # File path variable (needed for CLI)
        - G306  # File permissions 0644 (standard)

    # Forbid bare fmt.Print* in favor of internal/logger or cmd.OutOrStdout().
    # fmt.Fprint* remains allowed — formatters legitimately use it with buffers.
    # analyze-types is off: the pattern is a literal package.function match, so
    # the extra type-flow analysis would only slow the run without catching more.
    forbidigo:
      forbid:
        - pattern: '^fmt\.Print(ln|f)?$'
          msg: "use internal/logger or cmd.OutOrStdout() — bare fmt.Print* bypasses the output pipeline"

    # Revive configuration
    revive:
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          arguments:
            - checkPrivateReceivers
            - disableStutteringCheck
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id

    # Spelling
    misspell:
      locale: US

    # Maintainability index — warn when a function's index falls BELOW this
    # threshold. Higher number = stricter (we raised 20 → 25 to tighten).
    maintidx:
      under: 25

    # No linting
    nolintlint:
      allow-unused: false
      require-explanation: true
      require-specific: true

  exclusions:
    generated: strict
    warn-unused: true

    rules:
      # Test files: exclude complexity, duplication, and ergonomic checks.
      # Tests legitimately have table-driven setup (funlen/cyclop/gocognit),
      # debug prints (forbidigo), and shared fixtures (gochecknoglobals).
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - funlen
          - dupl
          - maintidx
          - err113
          - goconst
          - mnd
          - errcheck
          - gosec
          - wrapcheck
          - forbidigo
          - gochecknoglobals
          - gochecknoinits

      # internal/ has legitimately-global config data (embed targets, sentinel
      # errors, compiled regex singletons, template funcMap). The migration
      # goal was to eliminate global state in cmd/ — internal/ is fine.
      # Anchored with ^ so it only matches the top-level internal/ tree.
      - path: ^internal/
        linters:
          - gochecknoglobals

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  new: false
  fix: false
