# GoReleaser configuration
# https://goreleaser.com/customization/
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: tfskel

before:
  hooks:
    - go mod tidy

builds:
  - id: tfskel
    binary: tfskel
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    # Ignore combinations that don't make sense
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64  # Windows ARM64 support is limited
    ldflags:
      - -s -w
      - -X github.com/ishuar/tfskel/cmd.Commit={{.Commit}}
      - -X github.com/ishuar/tfskel/cmd.Date={{.Date}}
      - -X github.com/ishuar/tfskel/cmd.BuildTime={{.CommitTimestamp}}
    mod_timestamp: "{{.CommitTimestamp}}"
    flags:
      - -trimpath

changelog:
  disable: true

archives:
  - id: tfskel-archive
    formats: ['tar.gz']
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: ['zip']
    files:
      - README.md
      - LICENSE
      - CONTRIBUTING.md
      - docs/**/*

checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

release:
  draft: false
  skip_upload: false
  mode: keep-existing

# Validate configuration
gomod:
  proxy: true

# Set a custom directory for artifacts
dist: dist
