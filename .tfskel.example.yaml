# tfskel configuration file
# For more information, visit: https://github.com/ishuar/tfskel/blob/main/docs/tfskel-book.md#configuration

# Terraform version constraint, Required with default embedded templates
terraform_version: terraform-version-constraint # e.g. ~> 1.13

# AWS provider and backend configuration
backend:
  s3:
    # Required with default embedded templates:
    # Update with your globally unique S3 bucket name for Terraform state storage.
    # Accepts Go template syntax — see "Template context variables" in README for available placeholders.
    # Example with templating: "my-tfstate-{{.Env}}-{{.AccountID}}"
    bucket_name: CHANGE_ME_WITH_YOUR_GLOBALLY_UNIQUE_S3_BUCKET_NAME
provider:
  aws:
    version: aws-provider-version-constraint # e.g. ~> 6.0
    # Optional: Add default tags to all resources using AWS provider, applicable to versions.tf.tmpl templates
    default_tags: {}
      # Example:
      # managed_by: tfskel
      # github_repo: tfskel
    # Required: Update with the AWS regions where you deploy resources
    regions: []
      # Example:
      # - eu-central-1
    # Required: Update with your actual AWS account IDs for each environment
    account_mapping: {}
      # Example:
      # dev: "123456789012"
      # prd: "210987654321"
      # stg: "109876543210"

# Critical resources for drift analysis
# These resources will be added to the default AWS critical resources list
# Updates to these resources will be flagged as HIGH severity in drift analysis
# Optional: Customize this list based on the resources that are most critical to your infrastructure
critical_resources: []
  # Example: Add compute resources as critical
  # - aws_lambda_function
  # - aws_ecs_cluster
  # - aws_eks_cluster
  # Example: Add API Gateway as critical
  # - aws_api_gateway_rest_api
  # - aws_apigatewayv2_api
  # Example: Add CloudFront as critical
  # - aws_cloudfront_distribution

# Top resources count for summary tables (optional, default: 10)
# Controls how many resources to show in "Changes by Resource Type" and "Changes by Module" tables
# Set to 0 to show all items (not recommended for large projects)
top_resources_count: 10

# Custom templates directory configuration
templates:
  # Optional: Custom templates directory
  # to override default embedded templates, create custom templates
  # with the same name in the custom templates directory,
  # e.g. custom-dir/versions.tf.tmpl will override the default embedded versions.tf.tmpl template
  # NOTE: All files ending with .tmpl extension will be processed as Go templates
  dir: /path/to/custom/templates

# GitHub Actions workflow generation configuration
workflows:
  # Enable GitHub Actions workflow generation
  create: false
  # GitHub workflow filename stem. Accepts Go template syntax.
  # Available placeholders: {{.AppDir}}, {{.Env}}, {{.Region}}, {{.ShortRegion}}, {{.AccountID}}
  # Template functions: toLower, toUpper, replace, trimSpace, trimPrefix, trimSuffix, stripConstraint, etc.
  # The workflow type suffix (-lint, -terraform) and .yaml extension are appended automatically.
  # Example: "{{.AppDir}}-{{.Env}}-{{.ShortRegion}}" -> "myapp-dev-euc1-terraform.yaml"
  # See README "Template context variables" section for the full reference.
  name_template: "{{.AppDir}}-{{.Env}}-{{.ShortRegion}}"
  # Full ARN (takes priority, optional). Accepts Go template syntax.
  # Available placeholders: {{.AccountID}}, {{.Env}}, {{.Region}}, {{.ShortRegion}}, {{.AppDir}}
  aws_role_arn: "arn:aws:iam::{{.AccountID}}:role/{{.Env}}-githubactionsrole"
  # IAM role for workflows (optional). Accepts Go template syntax.
  # Available placeholders: {{.AccountID}}, {{.Env}}, {{.Region}}, {{.ShortRegion}}, {{.AppDir}}
  aws_role_name: "{{.Env}}-githubactionsrole"
