## This file is auto generated by tfskel: https://github.com/ishuar/tfskel

name: 'Reusable: Terraform Lint workflow'
on:
  workflow_call:
    inputs:
      terraform_files_path:
        required: true
        description: Path to the terraform files to validate
        type: string

      enable_terraform_docs_check:
        required: false
        description: Enable terraform-docs check , applicable for modules only.
        type: boolean
        default: false

      terraform_docs_version:
        required: false
        description: Version of terraform-docs to use
        type: string
        default: 'v0.20.0'

      tflint_version:
        required: false
        description: Version of tflint to use
        type: string
        default: 'v0.59.1'

concurrency:
  group: 'lint-${{ inputs.terraform_files_path }}-${{ github.event.pull_request.number || github.ref_name }}'
  cancel-in-progress: true

jobs:
  lint:
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        name: Cache plugin dir
        with:
          path: ~/.tflint.d/plugins
          key: tflint-${{ inputs.tflint_version }}-${{ hashFiles('.tflint.hcl') }}

      - name: Get Terraform Version
        id: get-tf-version
        run: |
          # Extract envs/<env>
          env_path=$(echo "${{ inputs.terraform_files_path }}" | cut -d'/' -f1-2)

          # Build path to .terraform-version file
          tf_file="$env_path/.terraform-version"

          # Read Terraform version
          TF_VERSION=$(cat "$tf_file")
          echo "Terraform version is $TF_VERSION"

          # Export as step output
          echo "TF_VERSION=$TF_VERSION" >> $GITHUB_OUTPUT

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        name: Setup Terraform
        with:
          terraform_version: ${{ steps.get-tf-version.outputs.TF_VERSION }}
      - name: Check Terraform Format
        id: fmt
        continue-on-error: true
        run: terraform fmt -check -recursive -diff "${{ inputs.terraform_files_path }}"

      - uses: terraform-linters/setup-tflint@b480b8fcdaa6f2c577f8e4fa799e89e756bb7c93 # v6.2.2
        name: Setup TFLint
        with:
          tflint_version: ${{ inputs.tflint_version }}

      - name: Show version
        run: tflint --version

      - name: Init TFLint
        run: tflint --init
        env:
          # https://github.com/terraform-linters/tflint/blob/master/docs/user-guide/plugins.md#avoiding-rate-limiting
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        id: tflint
        continue-on-error: true
        run: tflint -f compact
        working-directory: '${{ inputs.terraform_files_path }}'

      - name: Render and check diff on Readme with Terraform Changes
        if: always() && !cancelled() && inputs.enable_terraform_docs_check
        working-directory: '${{ inputs.terraform_files_path }}'
        id: docs
        continue-on-error: true
        run: |
          curl -sSfL https://github.com/terraform-docs/terraform-docs/releases/download/${{ inputs.terraform_docs_version }}/terraform-docs-${{ inputs.terraform_docs_version }}-linux-amd64.tar.gz | tar xzf - terraform-docs
          chmod +x terraform-docs
          ./terraform-docs .
          git diff --exit-code

      - name: Validation summary
        id: validation-summary
        if: always() && !cancelled()
        run: |
          FAILED=false
          TABLE="| Check | Status | Details |\n|-------|--------|---------|"

          add_row() {
            local name="$1" outcome="$2" fix="$3"
            case "$outcome" in
              failure) TABLE="${TABLE}\n| ${name} | :x: Failed | ${fix} |"; FAILED=true ;;
              success) TABLE="${TABLE}\n| ${name} | :white_check_mark: Passed | — |" ;;
              *)       TABLE="${TABLE}\n| ${name} | :fast_forward: Skipped | — |" ;;
            esac
          }

          add_row "Terraform Format" "${{ steps.fmt.outcome }}" "Run \`terraform fmt\`"
          add_row "TFLint"           "${{ steps.tflint.outcome }}" "Run \`tflint\`"

          if [[ "${{ inputs.enable_terraform_docs_check }}" == "true" ]]; then
            add_row "Terraform Docs" "${{ steps.docs.outcome }}" "Run \`make docs\`"
          else
            TABLE="${TABLE}\n| Terraform Docs | :heavy_minus_sign: Disabled | — |"
          fi

          echo "failed=${FAILED}" >> "$GITHUB_OUTPUT"
          {
            echo "summary_table<<EOFTABLE"
            echo -e "${TABLE}"
            echo "EOFTABLE"
          } >> "$GITHUB_OUTPUT"

      - name: Comment validation summary on PR
        if: always() && !cancelled() && github.event_name == 'pull_request' && steps.validation-summary.outputs.failed == 'true'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          reactions: eyes
          mode: recreate
          comment-tag: validation-summary-${{ inputs.terraform_files_path }}
          message: |
            ## Terraform linting summary for `${{ inputs.terraform_files_path }}`

            ${{ steps.validation-summary.outputs.summary_table }}

            ---

            > [!IMPORTANT]
            > *This comment will be automatically updated on new commits and deleted when all checks pass.*

      - name: Delete validation comment if all checks passed
        if: always() && !cancelled() && github.event_name == 'pull_request' && steps.validation-summary.outputs.failed == 'false'
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          comment-tag: validation-summary-${{ inputs.terraform_files_path }}
          mode: delete

      - name: Fail job if any validation failed
        if: always() && !cancelled() && steps.validation-summary.outputs.failed == 'true'
        run: exit 1
