## This file is auto generated by tfskel

name: 'Terraform Plan and Apply workflow'

on:
  workflow_call:
    inputs:
      terraform_files_path:
        required: true
        description: Path to the terraform configuration files
        type: string
      terraform_log_level:
        required: false
        description: Terraform log level
        type: string
        default: 'INFO'
      runner:
        type: string
        required: false
        default: ubuntu-latest
        description: The Github action runner OS , on which the action runs.
      cache_hash_file:
        type: string
        required: false
        default: '/versions.tf'
        description: The file used to create common hash cache naming.
      aws_region:
        type: string
        required: true
        default: eu-west-1
        description: The AWS region in which terraform resources should be deployed.
      aws_role_to_assume:
        type: string
        required: true
        description: The AWS role to assume for the terraform deployment.
      auto_apply:
        type: boolean
        required: false
        default: false
        description: Set to true to auto apply terraform plan. Not recommended for production env, always review plan before applying.
      environment:
        type: string
        required: true
        description: The environment in which the terraform resources should be deployed.
      tfskel_version:
        type: string
        required: false
        default: 'latest'
        description: The version of tfskel to use for plan analysis.

env:
  # verbosity setting for Terraform logs
  TF_LOG: ${{ inputs.terraform_log_level }}
  ##! https://developer.hashicorp.com/terraform/cli/config/environment-variables
  TF_PLUGIN_CACHE_DIR: '${{ github.workspace }}/.terraform-plugin-cache'
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  GITHUB_TOKEN: ${{ github.token }}
  TERRAFORM_SSH_KEY: ${{ secrets.TERRAFORM_MODULES_SSH_DEPLOY_KEY }}

permissions:
  pull-requests: write
  contents: read
  id-token: write

concurrency:
  group: 'tf-plan-apply-${{ inputs.terraform_files_path }}-${{ github.event.pull_request.number || github.ref_name }}'
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform Plan Stage
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    outputs:
      plan_path: ${{ steps.plan.outputs.plan_path }}
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - name: checkout the repository
        uses: actions/checkout@v6

      ## No Static Credentials, use OIDC to assume role
      ## Extendible to Least Privilege Principle
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - uses: actions/cache@v5
        name: 'Terraform cache'
        id: cache
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-${{ inputs.terraform_files_path }}-${{ hashFiles(format('{0}/{1}', inputs.terraform_files_path , inputs.cache_hash_file)) }}

      - if: ${{ steps.cache.outputs.cache-hit != 'true' }}
        name: Create TF_PLUGIN_CACHE_DIR
        shell: bash
        run: mkdir -p ${{ env.TF_PLUGIN_CACHE_DIR }}

      ## dflook/terraform-plan stores a hash of the generated plan inside a hidden
      ## PR comment. On merge, dflook/terraform-apply finds the PR by its merge
      ## commit SHA, re-runs terraform plan, and verifies the hash matches before
      ## applying — ensuring exactly what was reviewed gets applied.
      ## No artifact upload needed, and no sensitive plan file is exposed.
      - name: terraform plan
        uses: dflook/terraform-plan@v2.2.3
        id: plan
        with:
          path: ${{ inputs.terraform_files_path }}
          label: ${{ inputs.terraform_files_path }}
          add_github_comment: true

      - name: Set up Go for tfskel analysis
        uses: actions/setup-go@v6
        if: steps.plan.outputs.changes == 'true'
        with:
          go-version: '1.24.0'
          cache: true
          cache-dependency-path: |
            ${{ inputs.terraform_files_path }}/.terraform.lock.hcl

      - name: Install tfskel & analyze plan
        id: analyze-plan
        if: steps.plan.outputs.changes == 'true'
        ## tfskel exit with non-zero code as per plan analysis results.
        ## but we don't want to fail the job because of that
        continue-on-error: true
        run: |
          go install github.com/ishuar/tfskel@${{ inputs.tfskel_version }}
          which tfskel && tfskel --version
          tfskel drift plan --plan-file ${{ steps.plan.outputs.json_plan_path }}

  apply:
    name: Terraform Apply Stage
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    needs: plan
    ## if not cancelled and not failed and plan was created successfully
    ## if plan has changes
    ## Auto-apply behavior:
    ## - On PR: Only when auto_apply=true (use with caution, especially for production)
    ## - On push to main: Always applies (ensure branch protection is enabled)
    ## - On manual dispatch: Respects auto_apply input
    ## IMPORTANT: Set auto_apply=false in production workflows unless you have proper approval gates
    if: ${{
      !cancelled() &&
      !failure() &&
      needs.plan.outputs.changes == 'true' &&
      (
      (github.event_name == 'pull_request' && inputs.auto_apply == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.auto_apply == true)
      )
      }}
    steps:
      - name: checkout the repository
        uses: actions/checkout@v6

        ## ::Highlight:: Security: Least Privilege Principle
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - uses: actions/cache@v5
        name: 'Terraform cache'
        id: cache
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: ${{ runner.os }}-${{ inputs.terraform_files_path }}-${{ hashFiles(format('{0}/{1}', inputs.terraform_files_path, inputs.cache_hash_file)) }}

      - name: Terraform apply
        uses: dflook/terraform-apply@v2.2.3
        with:
          path: ${{ inputs.terraform_files_path }}
          label: ${{ inputs.terraform_files_path }}
