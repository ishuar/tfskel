## This file is auto generated by tfskel: https://github.com/ishuar/tfskel

name: 'Reusable: Terraform Plan and Apply workflow'

on:
  workflow_call:
    inputs:
      terraform_files_path:
        required: true
        description: Path to the terraform configuration files
        type: string
      terraform_log_level:
        required: false
        description: Terraform log level
        type: string
        default: 'INFO'
      runner:
        type: string
        required: false
        default: ubuntu-latest
        description: The Github action runner OS , on which the action runs.
      cache_hash_file:
        type: string
        required: false
        default: '/versions.tf'
        description: The file used to create common hash cache naming.
      aws_region:
        type: string
        required: true
        description: The AWS region in which terraform resources should be deployed.
      aws_role_to_assume:
        type: string
        required: true
        description: The AWS role to assume for the terraform deployment.
      auto_apply:
        type: boolean
        required: false
        default: false
        description: Set to true to auto apply terraform plan. Not recommended for production env, always review plan before applying.
      environment:
        type: string
        required: true
        description: The environment in which the terraform resources should be deployed.
      tfskel_version:
        type: string
        required: false
        default: 'latest'
        description: The version of tfskel to use for plan analysis.
      tfskel_force_color:
        type: boolean
        required: false
        default: true
        description: Force color output in tfskel operations.
    secrets:
      terraform_modules_ssh_deploy_key:
        required: false
        description: |-
          SSH private key for accessing private terraform modules,
          if applicable. Ensure the corresponding public key is added to the repository deploy keys with read access.
          For enhanced security, consider using a dedicated deploy key with limited permissions.

env:
  # verbosity setting for Terraform logs
  TF_LOG: ${{ inputs.terraform_log_level }}
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  GITHUB_TOKEN: ${{ github.token }}

permissions:
  pull-requests: write
  contents: read
  id-token: write

jobs:
  plan:
    name: Plan Stage
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    concurrency:
      group: 'tf-plan-${{ inputs.terraform_files_path }}-${{ github.event.pull_request.number || github.ref_name }}'
      cancel-in-progress: true
    outputs:
      plan_path: ${{ steps.plan.outputs.plan_path }}
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - name: checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      ## No Static Credentials, use OIDC to assume role
      ## Extendible to Least Privilege Principle
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        name: 'cache terraform plugins'
        id: cache
        with:
          # ref: https://github.com/dflook/terraform-github-actions/issues/105
          path: ${{ runner.temp }}/_github_home/.terraform.d/plugin-cache
          key: ${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.terraform_files_path , inputs.cache_hash_file)) }}

      ## dflook/terraform-plan stores a hash of the generated plan inside a hidden
      ## PR comment. On merge, dflook/terraform-apply finds the PR by its merge
      ## commit SHA, re-runs terraform plan, and verifies the hash matches before
      ## applying — ensuring exactly what was reviewed gets applied.
      ## No artifact upload needed, and no sensitive plan file is exposed.
      - name: terraform plan
        uses: dflook/terraform-plan@7878bff63e2099cdc9be9a6f33cbbbf687f8f0fe # v2.2.3
        id: plan
        with:
          path: ${{ inputs.terraform_files_path }}
          label: ${{ inputs.terraform_files_path }}
          add_github_comment: true
        env:
          TERRAFORM_SSH_KEY: ${{ secrets.terraform_modules_ssh_deploy_key }}

      - name: Set up Go for tfskel analysis
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        if: steps.plan.outputs.changes == 'true'
        with:
          go-version: '1.24.0'
          cache: true
          cache-dependency-path: |
            ${{ inputs.terraform_files_path }}/.terraform.lock.hcl

      - name: Install tfskel & review plan
        id: review-plan
        if: steps.plan.outputs.changes == 'true'
        ## tfskel exit with non-zero code as per plan analysis results.
        ## but we don't want to fail the job because of that
        continue-on-error: true
        env:
          FORCE_COLOR: ${{ inputs.tfskel_force_color }}
        run: |
          go install github.com/ishuar/tfskel@${{ inputs.tfskel_version }}
          tfskel --version
          tfskel review plan --json-file ${{ steps.plan.outputs.json_plan_path }}

  apply:
    name: Apply Stage
    runs-on: ${{ inputs.runner }}
    environment: ${{ inputs.environment }}
    concurrency:
      group: 'tf-apply-${{ inputs.terraform_files_path }}-${{ inputs.environment }}'
      cancel-in-progress: false
    timeout-minutes: 45
    needs: plan
    ## if not cancelled and not failed and plan was created successfully
    ## if plan has changes
    ## Auto-apply behavior:
    ## - On PR: Only when auto_apply=true (use with caution, especially for production)
    ## - On push to main: Always applies (ensure branch protection is enabled)
    ## - On manual dispatch: Respects auto_apply input
    ## IMPORTANT: Set auto_apply=false in production workflows unless you have proper approval gates
    if: ${{
      !cancelled() &&
      !failure() &&
      needs.plan.outputs.changes == 'true' &&
      (
      (github.event_name == 'pull_request' && inputs.auto_apply == true) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.auto_apply == true)
      )
      }}
    steps:
      - name: checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

        ## ::Highlight:: Security: Least Privilege Principle
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@8df5847569e6427dd6c4fb1cf565c83acfa8afa7 # v6.0.0
        with:
          role-to-assume: ${{ inputs.aws_role_to_assume }}
          aws-region: ${{ inputs.aws_region }}

      - uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        name: 'Terraform cache'
        id: cache
        with:
          # ref: https://github.com/dflook/terraform-github-actions/issues/105
          path: ${{ runner.temp }}/_github_home/.terraform.d/plugin-cache
          key: ${{ runner.os }}-${{ hashFiles(format('{0}/{1}', inputs.terraform_files_path , inputs.cache_hash_file)) }}

      - name: Terraform apply
        uses: dflook/terraform-apply@5489b988934a50bf1489d5b7c5253b46520a7dca # v2.2.3
        with:
          path: ${{ inputs.terraform_files_path }}
          label: ${{ inputs.terraform_files_path }}
        env:
          TERRAFORM_SSH_KEY: ${{ secrets.terraform_modules_ssh_deploy_key }}
